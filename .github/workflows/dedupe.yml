name: Auto Dedupe Cleanup

on:
  push:
  workflow_dispatch:

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cleanup script
        run: |
          node scripts/merge-duplicates.js || true

      - name: Commit cleanup
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "auto dedupe cleanup" || echo "no changes"
          git push || true
